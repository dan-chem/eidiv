{% extends "base.html" %}
{% block content %}
<div class="space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-xl font-semibold">Dienst {{ obj.nummer_formatiert }}</h1>
    <div class="flex flex-wrap gap-2">
      <a href="{% url 'index' %}" class="px-3 py-2 border rounded">Zurück zur Startseite</a>
      <a href="{% url 'dienst_pdf' obj.pk %}" class="px-3 py-2 border rounded text-blue-700 border-blue-300 hover:bg-blue-50">PDF speichern</a>
      {% if request.user.is_staff %}
        <a href="/admin/dienst/dienst/{{ obj.pk }}/change/" class="px-3 py-2 border rounded">Im Admin öffnen</a>
      {% endif %}
    </div>
  </div>

  <div class="bg-white p-4 rounded shadow">
    {% include "dienst/_full_details.html" %}
  </div>
</div>
{% endblock %}
